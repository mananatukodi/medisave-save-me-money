[project]
name = "medisave-backend"
version = "0.1.0"
description = "MediSave AI backend API - patient-first healthcare ecosystem (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "cryptography>=43",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Explicit, narrow discovery: ship only the application package.
# `alembic`, `scripts`, and `tests` are NOT part of the install.
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
